  <body>
    <div class="os-shell core-shell">
      <main class="core-experience" aria-labelledby="heroTitle">
        <section class="holo-card network-stage core-stage" aria-label="Prometheus living intelligence network">
          <canvas id="holoCanvas"></canvas>
          <div class="starfield" aria-hidden="true"></div>
          <div class="network-aura" aria-hidden="true"></div>

            <i id="coreState">listening ready</i>
          </div>
          <span class="sr-only" id="voiceStatus" aria-live="polite">Listening ready</span>

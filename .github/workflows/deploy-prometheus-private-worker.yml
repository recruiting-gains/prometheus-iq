name: Deploy Prometheus Private Worker

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Founder-approved commit at current origin/main (40 lowercase hex)
        required: true
        type: string
      approved_tree:
        description: Founder-approved tree for the exact commit (40 lowercase hex)
        required: true
        type: string
      batch_id:
        description: Founder-approved batch ID (BATCH-YYYYMMDD-NNN)
        required: true
        type: string
      current_production_version:
        description: Current private Worker version (canonical lowercase UUID)
        required: true
        type: string
      founder_authorization:
        description: Type exactly I AUTHORIZE THIS EXACT PROMETHEUS PRIVATE WORKER DEPLOYMENT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prometheus-private-worker
  cancel-in-progress: false

jobs:
  verification:
    name: Verify exact Founder-approved release
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'PrometheusRouteIQ/prometheus-iq' &&
        github.actor == 'PrometheusRouteIQ' &&
        github.triggering_actor == 'PrometheusRouteIQ' &&
        github.ref == 'refs/heads/main' &&
        github.ref_name == 'main' &&
        github.ref_type == 'branch' &&
        github.workflow == 'Deploy Prometheus Private Worker' &&
        github.workflow_ref == 'PrometheusRouteIQ/prometheus-iq/.github/workflows/deploy-prometheus-private-worker.yml@refs/heads/main' &&
        github.run_attempt == 1 &&
        inputs.founder_authorization == 'I AUTHORIZE THIS EXACT PROMETHEUS PRIVATE WORKER DEPLOYMENT'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact main repository
        # actions/checkout v4.3.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PrometheusRouteIQ/prometheus-iq
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up pinned Node runtime without dependency cache
        # actions/setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Install exact locked dependencies
        run: npm ci

      - name: Verify dispatch context, repository identity, config, Wrangler pin, and fsck
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PRODUCTION_VERSION: ${{ inputs.current_production_version }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: node scripts/run-github-actions-private-worker-deployment.mjs verify

      - name: Run complete repository test suite including security, Aegis, contracts, and build
        run: npm test

      - name: Run explicit lint gate
        run: npm run lint

      - name: Run explicit typecheck gate
        run: npm run typecheck

      - name: Run explicit security and secret scan gate
        run: npm run security:check

      - name: Run explicit tracked-source and local-artifact secret scanner
        run: node scripts/check-cloudflare-unattended-secret-presence.mjs --source=environment

      - name: Run explicit Aegis gate
        run: npm run security:aegis:verify

      - name: Run explicit cross-subsystem contract gate
        run: node scripts/verify-cross-subsystem-artifact-contracts.mjs

      - name: Run Infrastructure owner verifier and adversarial tests
        run: node scripts/verify-github-actions-private-worker-deployment.mjs && node --test tests/github-actions-private-worker-deployment.test.mjs

      - name: Run explicit production build gate
        run: npm run build

      - name: Require clean worktree, clean index, and valid Git objects
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fsck --full --strict

  deploy:
    name: Deploy exact private Worker after Founder approval
    needs: verification
    if: ${{ needs.verification.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prometheus-private-worker-production
    steps:
      - name: Checkout exact main repository
        # actions/checkout v4.3.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PrometheusRouteIQ/prometheus-iq
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up pinned Node runtime without dependency cache
        # actions/setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Install exact locked dependencies
        run: npm ci

      - name: Re-verify exact release before any deployment network mutation
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PRODUCTION_VERSION: ${{ inputs.current_production_version }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: node scripts/run-github-actions-private-worker-deployment.mjs verify

      - name: Run fixed guarded pre-deployment GET and HEAD smoke
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: timeout 120s node scripts/run-cloudflare-unattended-smoke.mjs --execute-fixed-profile

      - name: Verify active versions, dry-run, and deploy the exact private Worker once
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PRODUCTION_VERSION: ${{ inputs.current_production_version }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/run-github-actions-private-worker-deployment.mjs deploy

      - name: Run fixed guarded post-deployment GET and HEAD smoke
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: timeout 120s node scripts/run-cloudflare-unattended-smoke.mjs --execute-fixed-profile

      - name: Re-verify repository identity after deployment
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PRODUCTION_VERSION: ${{ inputs.current_production_version }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: node scripts/run-github-actions-private-worker-deployment.mjs verify

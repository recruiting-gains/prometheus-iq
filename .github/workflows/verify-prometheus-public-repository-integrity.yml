name: Verify Prometheus Public Repository Integrity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-prometheus-public-repository-integrity
  cancel-in-progress: false

jobs:
  integrity:
    name: Verify full public predeployment suite without deployment access
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'PrometheusRouteIQ/prometheus-iq' &&
        github.actor == 'PrometheusRouteIQ' &&
        github.triggering_actor == 'PrometheusRouteIQ' &&
        github.ref == 'refs/heads/main' &&
        github.ref_name == 'main' &&
        github.ref_type == 'branch' &&
        github.workflow == 'Verify Prometheus Public Repository Integrity' &&
        github.workflow_ref == 'PrometheusRouteIQ/prometheus-iq/.github/workflows/verify-prometheus-public-repository-integrity.yml@refs/heads/main' &&
        github.run_attempt == 1
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout complete main history
        # actions/checkout v4.3.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PrometheusRouteIQ/prometheus-iq
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up pinned Node runtime without dependency cache
        # actions/setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Verify exact repository and surface bounded integrity diagnostics
        run: node scripts/run-public-worker-repository-integrity-diagnostic.mjs

      - name: Install exact locked dependencies
        run: npm ci

      - name: Generate exact public assets before repository verification
        run: npm run build

      - name: Run complete repository verification suite
        run: npm test

      - name: Run explicit lint gate
        run: npm run lint

      - name: Run explicit typecheck gate
        run: npm run typecheck

      - name: Run explicit security gate
        run: npm run security:check

      - name: Run explicit Aegis gate
        run: npm run security:aegis:verify

      - name: Verify forward rollback candidate and rehearsal
        run: npm run infrastructure:route-iq-forward-rollback:check

      - name: Verify public deployment assets
        run: npm run infrastructure:route-iq-public-deployment-assets:check

      - name: Verify deterministic public forward rollback identity
        run: node scripts/verify-route-iq-public-forward-rollback.mjs

      - name: Verify Infrastructure owner provenance and repository integrity
        run: node scripts/verify-route-iq-public-repository-integrity-repair.mjs

      - name: Verify public deployment workflow contract without dispatch
        run: node scripts/verify-github-actions-public-worker-deployment.mjs

      - name: Verify cross-subsystem artifact contracts
        run: npm run overwatch:artifact-contracts:check

      - name: Verify Overwatch public release readiness pins
        run: node scripts/verify-overwatch-route-iq-public-deployment-integrity-repair-readiness.mjs

      - name: Require unchanged repository after verification
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node scripts/run-public-worker-repository-integrity-diagnostic.mjs

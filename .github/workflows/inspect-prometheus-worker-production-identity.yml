name: Inspect Prometheus Worker Production Identity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-prometheus-worker-production-identity
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'PrometheusRouteIQ/prometheus-iq' &&
      github.actor == 'PrometheusRouteIQ' &&
      github.triggering_actor == 'PrometheusRouteIQ' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main' &&
      github.ref_type == 'branch' &&
      github.workflow == 'Inspect Prometheus Worker Production Identity' &&
      github.workflow_ref == 'PrometheusRouteIQ/prometheus-iq/.github/workflows/inspect-prometheus-worker-production-identity.yml@refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Use governed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.4.1"
      - name: Verify no-secret identity context
        run: node scripts/run-github-actions-private-worker-read-only-identity.mjs preflight

  inspect:
    needs: preflight
    if: needs.preflight.result == 'success'
    environment:
      name: prometheus-private-worker-production
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Use governed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.4.1"
      - name: Read exact Worker identities
        run: node scripts/run-github-actions-private-worker-read-only-identity.mjs inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

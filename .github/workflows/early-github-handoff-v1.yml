name: Prometheus Early GitHub Handoff Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact synchronized main commit to qualify
        required: true
        type: string
      candidate_tree:
        description: Exact tree for the synchronized main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prometheus-early-github-handoff-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Verify exact early-handoff candidate on a clean hosted runner
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'PrometheusRouteIQ/prometheus-iq' &&
        github.actor == 'PrometheusRouteIQ' &&
        github.triggering_actor == 'PrometheusRouteIQ' &&
        github.ref == 'refs/heads/main' &&
        github.ref_name == 'main' &&
        github.ref_type == 'branch' &&
        github.sha == inputs.candidate_commit &&
        github.workflow == 'Prometheus Early GitHub Handoff Qualification' &&
        github.workflow_ref == 'PrometheusRouteIQ/prometheus-iq/.github/workflows/early-github-handoff-v1.yml@refs/heads/main' &&
        github.run_attempt == 1
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact synchronized main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PrometheusRouteIQ/prometheus-iq
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Gate exact commit, branch, and remote before repository code
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ inputs.candidate_tree }}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${{ inputs.candidate_commit }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up governed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.4.1"

      - name: Install exact locked dependencies
        run: npm ci

      - name: Verify permanent early handoff controls
        run: |
          node scripts/verify-early-github-handoff-v1.mjs
          node scripts/verify-overwatch-early-github-handoff-v1.mjs

      - name: Build runtime once for drift-sensitive tests
        run: npm run build

      - name: Run each active test exactly once
        run: npm test

      - name: Run explicit static, security, Aegis, and contract gates
        run: |
          npm run lint
          npm run typecheck
          npm run security:check
          npm run security:aegis:verify
          node scripts/verify-cross-subsystem-artifact-contracts.mjs

      - name: Require unchanged hosted checkout
        shell: bash
        run: |
          set -eu
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ inputs.candidate_tree }}"

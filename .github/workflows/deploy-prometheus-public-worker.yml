name: Deploy Prometheus Public Worker

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Founder-approved commit at current origin/main (40 lowercase hex)
        required: true
        type: string
      approved_tree:
        description: Founder-approved tree for the exact commit (40 lowercase hex)
        required: true
        type: string
      batch_id:
        description: Founder-approved batch ID (BATCH-YYYYMMDD-NNN)
        required: true
        type: string
      current_public_version:
        description: Current public Worker version (canonical lowercase UUID)
        required: true
        type: string
      current_private_version:
        description: Current private Worker version (canonical lowercase UUID)
        required: true
        type: string
      rollback_artifact_sha256:
        description: Verified forward rollback source-artifact SHA-256
        required: true
        type: string
      founder_authorization:
        description: Type exactly I AUTHORIZE THIS EXACT PROMETHEUS PUBLIC WORKER DEPLOYMENT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prometheus-public-worker
  cancel-in-progress: false

jobs:
  verification:
    name: Verify exact Founder-approved public release
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'PrometheusRouteIQ/prometheus-iq' &&
        github.actor == 'PrometheusRouteIQ' &&
        github.triggering_actor == 'PrometheusRouteIQ' &&
        github.ref == 'refs/heads/main' &&
        github.ref_name == 'main' &&
        github.ref_type == 'branch' &&
        github.workflow == 'Deploy Prometheus Public Worker' &&
        github.workflow_ref == 'PrometheusRouteIQ/prometheus-iq/.github/workflows/deploy-prometheus-public-worker.yml@refs/heads/main' &&
        github.run_attempt == 1 &&
        inputs.founder_authorization == 'I AUTHORIZE THIS EXACT PROMETHEUS PUBLIC WORKER DEPLOYMENT'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact main repository
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: PrometheusRouteIQ/prometheus-iq
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up pinned Node runtime without dependency cache
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install exact locked dependencies
        run: npm ci

      - name: Verify no-secret dispatch context, exact repository, contracts, rollback, Wrangler, and Git integrity
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PUBLIC_VERSION: ${{ inputs.current_public_version }}
          PROMETHEUS_CURRENT_PRIVATE_VERSION: ${{ inputs.current_private_version }}
          PROMETHEUS_ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: node scripts/run-github-actions-public-worker-deployment.mjs verify

      - name: Run Overwatch public CRM Founder Access deployment readiness gates
        run: |
          node scripts/verify-overwatch-route-iq-public-crm-founder-access-deployment-readiness.mjs
          node --test tests/overwatch-route-iq-public-crm-founder-access-deployment-readiness.test.mjs

      - name: Run complete repository test suite
        run: npm test

      - name: Run explicit lint and typecheck gates
        run: npm run lint && npm run typecheck

      - name: Run explicit security, secret, Aegis, and contract gates
        run: |
          npm run security:check
          node scripts/check-cloudflare-unattended-secret-presence.mjs --source=environment
          npm run security:aegis:verify
          node scripts/verify-cross-subsystem-artifact-contracts.mjs

      - name: Run public deployment, Founder Access, rollback, and smoke owner gates
        run: |
          node scripts/verify-github-actions-public-worker-deployment.mjs
          node scripts/verify-cloudflare-public-crm-founder-access.mjs
          node scripts/verify-route-iq-public-forward-rollback.mjs "${{ inputs.rollback_artifact_sha256 }}"
          node scripts/run-cloudflare-public-worker-smoke.mjs --dry-run
          node --test tests/github-actions-public-worker-deployment.test.mjs tests/cloudflare-public-crm-founder-access.test.mjs

      - name: Run explicit production build gate
        run: npm run build

      - name: Require clean worktree, clean index, and valid Git objects
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node scripts/run-public-worker-repository-integrity-diagnostic.mjs

  deploy:
    name: Deploy exact public Worker after Founder dispatch
    needs: verification
    if: ${{ needs.verification.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prometheus-public-worker-production
    steps:
      - name: Checkout exact main repository
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: PrometheusRouteIQ/prometheus-iq
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up pinned Node runtime without dependency cache
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install exact locked dependencies
        run: npm ci

      - name: Re-verify exact release before any Cloudflare request
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PUBLIC_VERSION: ${{ inputs.current_public_version }}
          PROMETHEUS_CURRENT_PRIVATE_VERSION: ${{ inputs.current_private_version }}
          PROMETHEUS_ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: node scripts/run-github-actions-public-worker-deployment.mjs verify

      - name: Run fixed pre-deployment GET and HEAD smoke with zero CRM writes
        run: timeout 120s node scripts/run-cloudflare-public-worker-smoke.mjs --execute-fixed-profile

      - name: Verify both active versions and deploy the exact public Worker once
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PUBLIC_VERSION: ${{ inputs.current_public_version }}
          PROMETHEUS_CURRENT_PRIVATE_VERSION: ${{ inputs.current_private_version }}
          PROMETHEUS_ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROUTE_IQ_REQUEST_CRM_ACCESS_TEAM_DOMAIN: ${{ secrets.ROUTE_IQ_REQUEST_CRM_ACCESS_TEAM_DOMAIN }}
          ROUTE_IQ_REQUEST_CRM_ACCESS_AUDIENCE: ${{ secrets.ROUTE_IQ_REQUEST_CRM_ACCESS_AUDIENCE }}
          ROUTE_IQ_REQUEST_CRM_FOUNDER_SUBJECT_SHA256: ${{ secrets.ROUTE_IQ_REQUEST_CRM_FOUNDER_SUBJECT_SHA256 }}
        run: node scripts/run-github-actions-public-worker-deployment.mjs deploy

      - name: Run fixed post-deployment GET and HEAD smoke with zero CRM writes
        run: timeout 120s node scripts/run-cloudflare-public-worker-smoke.mjs --execute-fixed-profile

      - name: Re-verify exact repository and rollback identity after deployment
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PUBLIC_VERSION: ${{ inputs.current_public_version }}
          PROMETHEUS_CURRENT_PRIVATE_VERSION: ${{ inputs.current_private_version }}
          PROMETHEUS_ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: node scripts/run-github-actions-public-worker-deployment.mjs verify

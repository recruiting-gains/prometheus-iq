name: Deploy Prometheus Public Worker

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Founder-approved qualified commit at current origin/main (40 lowercase hex)
        required: true
        type: string
      approved_tree:
        description: Founder-approved qualified tree (40 lowercase hex)
        required: true
        type: string
      batch_id:
        description: Founder-approved deployment batch ID (BATCH-YYYYMMDD-NNN)
        required: true
        type: string
      current_public_version:
        description: Current public Worker version prerequisite (canonical lowercase UUID)
        required: true
        type: string
      current_private_version:
        description: Current private Worker version prerequisite (canonical lowercase UUID)
        required: true
        type: string
      qualification_run_id:
        description: Successful qualification workflow run ID
        required: true
        type: string
      qualification_artifact_id:
        description: Immutable GitHub artifact ID emitted by qualification
        required: true
        type: string
      qualified_artifact_sha256:
        description: Qualified payload SHA-256 emitted by qualification
        required: true
        type: string
      qualified_manifest_sha256:
        description: Qualified release manifest SHA-256 emitted by qualification
        required: true
        type: string
      deployment_asset_sha256:
        description: Qualified public deployment assets SHA-256
        required: true
        type: string
      rollback_contract_sha256:
        description: Qualified forward rollback contract SHA-256
        required: true
        type: string
      rollback_artifact_sha256:
        description: Qualified deterministic forward rollback artifact SHA-256
        required: true
        type: string
      workflow_contract_sha256:
        description: Qualified Infrastructure Workflow v2 contract SHA-256
        required: true
        type: string
      founder_authorization:
        description: Type exactly I AUTHORIZE THIS EXACT PROMETHEUS PUBLIC WORKER DEPLOYMENT
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-prometheus-public-worker
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate immutable qualified artifact without production access
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'PrometheusRouteIQ/prometheus-iq' &&
        github.actor == 'PrometheusRouteIQ' &&
        github.triggering_actor == 'PrometheusRouteIQ' &&
        github.ref == 'refs/heads/main' &&
        github.ref_name == 'main' &&
        github.ref_type == 'branch' &&
        github.workflow == 'Deploy Prometheus Public Worker' &&
        github.workflow_ref == 'PrometheusRouteIQ/prometheus-iq/.github/workflows/deploy-prometheus-public-worker.yml@refs/heads/main' &&
        github.run_attempt == 1 &&
        inputs.founder_authorization == 'I AUTHORIZE THIS EXACT PROMETHEUS PUBLIC WORKER DEPLOYMENT'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact main repository
        # actions/checkout v4.3.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PrometheusRouteIQ/prometheus-iq
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up exact qualification and deployment Node runtime
        # actions/setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.4.1"

      - name: Install exact locked deployment tooling
        run: npm ci

      - name: Download only the Founder-pinned immutable qualification artifact
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.qualification_artifact_id }}
          github-token: ${{ github.token }}
          repository: PrometheusRouteIQ/prometheus-iq
          run-id: ${{ inputs.qualification_run_id }}
          path: ${{ runner.temp }}/prometheus-public-qualified-release

      - name: Verify every qualified identity with zero Cloudflare request
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PUBLIC_VERSION: ${{ inputs.current_public_version }}
          PROMETHEUS_CURRENT_PRIVATE_VERSION: ${{ inputs.current_private_version }}
          PROMETHEUS_QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          PROMETHEUS_QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          PROMETHEUS_QUALIFIED_ARTIFACT_SHA256: ${{ inputs.qualified_artifact_sha256 }}
          PROMETHEUS_QUALIFIED_MANIFEST_SHA256: ${{ inputs.qualified_manifest_sha256 }}
          PROMETHEUS_DEPLOYMENT_ASSET_SHA256: ${{ inputs.deployment_asset_sha256 }}
          PROMETHEUS_ROLLBACK_CONTRACT_SHA256: ${{ inputs.rollback_contract_sha256 }}
          PROMETHEUS_ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
          PROMETHEUS_WORKFLOW_CONTRACT_SHA256: ${{ inputs.workflow_contract_sha256 }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          PROMETHEUS_QUALIFIED_RELEASE_PATH: ${{ runner.temp }}/prometheus-public-qualified-release
          PROMETHEUS_RUNNER_IMAGE: ubuntu-24.04
        run: node scripts/run-github-actions-public-worker-qualification.mjs verify

      - name: Require clean exact candidate after preflight
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "${{ inputs.approved_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ inputs.approved_tree }}"

  deploy:
    name: Deploy the exact qualified public artifact once
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: prometheus-public-worker-production
    steps:
      - name: Checkout exact main repository
        # actions/checkout v4.3.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PrometheusRouteIQ/prometheus-iq
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up exact qualification and deployment Node runtime
        # actions/setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.4.1"

      - name: Install exact locked deployment tooling
        run: npm ci

      - name: Download only the Founder-pinned immutable qualification artifact
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.qualification_artifact_id }}
          github-token: ${{ github.token }}
          repository: PrometheusRouteIQ/prometheus-iq
          run-id: ${{ inputs.qualification_run_id }}
          path: ${{ runner.temp }}/prometheus-public-qualified-release

      - name: Reverify immutable release before protected execution
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PUBLIC_VERSION: ${{ inputs.current_public_version }}
          PROMETHEUS_CURRENT_PRIVATE_VERSION: ${{ inputs.current_private_version }}
          PROMETHEUS_QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          PROMETHEUS_QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          PROMETHEUS_QUALIFIED_ARTIFACT_SHA256: ${{ inputs.qualified_artifact_sha256 }}
          PROMETHEUS_QUALIFIED_MANIFEST_SHA256: ${{ inputs.qualified_manifest_sha256 }}
          PROMETHEUS_DEPLOYMENT_ASSET_SHA256: ${{ inputs.deployment_asset_sha256 }}
          PROMETHEUS_ROLLBACK_CONTRACT_SHA256: ${{ inputs.rollback_contract_sha256 }}
          PROMETHEUS_ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
          PROMETHEUS_WORKFLOW_CONTRACT_SHA256: ${{ inputs.workflow_contract_sha256 }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          PROMETHEUS_QUALIFIED_RELEASE_PATH: ${{ runner.temp }}/prometheus-public-qualified-release
          PROMETHEUS_RUNNER_IMAGE: ubuntu-24.04
        run: node scripts/run-github-actions-public-worker-qualification.mjs verify

      - name: Cross the production boundary once, smoke with GET and HEAD, and forward-roll back only if critical
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PUBLIC_VERSION: ${{ inputs.current_public_version }}
          PROMETHEUS_CURRENT_PRIVATE_VERSION: ${{ inputs.current_private_version }}
          PROMETHEUS_QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          PROMETHEUS_QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          PROMETHEUS_QUALIFIED_ARTIFACT_SHA256: ${{ inputs.qualified_artifact_sha256 }}
          PROMETHEUS_QUALIFIED_MANIFEST_SHA256: ${{ inputs.qualified_manifest_sha256 }}
          PROMETHEUS_DEPLOYMENT_ASSET_SHA256: ${{ inputs.deployment_asset_sha256 }}
          PROMETHEUS_ROLLBACK_CONTRACT_SHA256: ${{ inputs.rollback_contract_sha256 }}
          PROMETHEUS_ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
          PROMETHEUS_WORKFLOW_CONTRACT_SHA256: ${{ inputs.workflow_contract_sha256 }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          PROMETHEUS_QUALIFIED_RELEASE_PATH: ${{ runner.temp }}/prometheus-public-qualified-release
          PROMETHEUS_RUNNER_IMAGE: ubuntu-24.04
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROUTE_IQ_REQUEST_CRM_ACCESS_TEAM_DOMAIN: ${{ secrets.ROUTE_IQ_REQUEST_CRM_ACCESS_TEAM_DOMAIN }}
          ROUTE_IQ_REQUEST_CRM_ACCESS_AUDIENCE: ${{ secrets.ROUTE_IQ_REQUEST_CRM_ACCESS_AUDIENCE }}
          ROUTE_IQ_REQUEST_CRM_FOUNDER_SUBJECT_SHA256: ${{ secrets.ROUTE_IQ_REQUEST_CRM_FOUNDER_SUBJECT_SHA256 }}
        run: node scripts/run-github-actions-public-worker-deployment-v2.mjs deploy

      - name: Reverify immutable artifact and exact repository after successful deployment
        env:
          PROMETHEUS_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PROMETHEUS_APPROVED_TREE: ${{ inputs.approved_tree }}
          PROMETHEUS_BATCH_ID: ${{ inputs.batch_id }}
          PROMETHEUS_CURRENT_PUBLIC_VERSION: ${{ inputs.current_public_version }}
          PROMETHEUS_CURRENT_PRIVATE_VERSION: ${{ inputs.current_private_version }}
          PROMETHEUS_QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          PROMETHEUS_QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          PROMETHEUS_QUALIFIED_ARTIFACT_SHA256: ${{ inputs.qualified_artifact_sha256 }}
          PROMETHEUS_QUALIFIED_MANIFEST_SHA256: ${{ inputs.qualified_manifest_sha256 }}
          PROMETHEUS_DEPLOYMENT_ASSET_SHA256: ${{ inputs.deployment_asset_sha256 }}
          PROMETHEUS_ROLLBACK_CONTRACT_SHA256: ${{ inputs.rollback_contract_sha256 }}
          PROMETHEUS_ROLLBACK_ARTIFACT_SHA256: ${{ inputs.rollback_artifact_sha256 }}
          PROMETHEUS_WORKFLOW_CONTRACT_SHA256: ${{ inputs.workflow_contract_sha256 }}
          PROMETHEUS_FOUNDER_AUTHORIZATION: ${{ inputs.founder_authorization }}
          PROMETHEUS_DISPATCH_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          PROMETHEUS_QUALIFIED_RELEASE_PATH: ${{ runner.temp }}/prometheus-public-qualified-release
          PROMETHEUS_RUNNER_IMAGE: ubuntu-24.04
        run: node scripts/run-github-actions-public-worker-qualification.mjs verify

      - name: Require clean exact candidate after deployment
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "${{ inputs.approved_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ inputs.approved_tree }}"
